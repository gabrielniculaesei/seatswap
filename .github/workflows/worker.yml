# Runs the solver worker on a schedule: process every job that is due, then exit.
#
# Off until the repository variable WORKER_ENABLED is set to "true"
# (Settings > Secrets and variables > Actions > Variables), so it does not fail
# every ten minutes before the secrets exist.
#
# The repo is public and so are these logs. The worker logs Telegram user ids at
# INFO, so it runs at WARNING here.

name: worker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  drain:
    if: vars.WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: solver/requirements.txt

      - name: Install dependencies
        run: pip install "ortools>=9.10" "psycopg[binary]>=3.1"

      - name: Process due jobs
        working-directory: solver
        run: python worker.py --once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          AERODATABOX_MODE: ${{ vars.AERODATABOX_MODE || 'off' }}
          LOG_LEVEL: WARNING
